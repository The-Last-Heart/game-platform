name: game
description: "The Last Heart — آخر قلب mobile client (foundation)"
publish_to: "none"
version: 0.0.1+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Socket.IO client for realtime match transport (compatible with Socket.IO 4 backend).
  socket_io_client: 3.1.2

  # Secure storage for resume token persistence across app restarts.
  flutter_secure_storage: 9.2.4
  audioplayers: ^6.8.1
  sensors_plus: ^7.1.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  rive: ^0.14.11
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/app-background.png
    - assets/sfx/ui_tap.mp3
  fonts:
    # Bundled Noto Sans Arabic (OFL) — matches design-tokens.json; offline-safe in release APK.
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
          weight: 400 
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
