# Local infrastructure — PostgreSQL, Redis, optional API + Admin web
#
# Safe local defaults only. Do not use these credentials in production.
# Copy .env.example to .env if you need to override values.
# Published ports bind to loopback by default (see BIND_HOST).
#
# Profiles:
#   (default)  postgres + redis only — `pnpm run infra:up`
#   apps       also builds/runs backend + admin-web — `pnpm run apps:up`

name: the-last-heart-local

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: lh-local-postgres
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lh_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lh_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-the_last_heart}
    volumes:
      - lh_local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lh_local} -d ${POSTGRES_DB:-the_last_heart}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.11-alpine
    container_name: lh-local-redis
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - lh_local_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.backend
    image: lh-local-backend:local
    container_name: lh-local-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-3000}:3000"
    volumes:
      # Persist Studio-uploaded challenge audio across image rebuilds.
      # Seeded from the image on first boot (see docker-entrypoint-backend.sh).
      - lh_local_content_pack:/app/content-pack
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-log}
      DATABASE_URL: postgres://${POSTGRES_USER:-lh_local}:${POSTGRES_PASSWORD:-lh_local_dev_only}@postgres:5432/${POSTGRES_DB:-the_last_heart}
      REDIS_URL: redis://redis:6379
      HEALTH_CHECK_DEPENDENCIES: "true"
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-43200}
      ADMIN_LOGIN_MAX_FAILURES: ${ADMIN_LOGIN_MAX_FAILURES:-5}
      ADMIN_LOGIN_THROTTLE_TTL_SECONDS: ${ADMIN_LOGIN_THROTTLE_TTL_SECONDS:-900}
      # Same default as apps/backend/.env.example so host ↔ Docker local switches
      # do not invalidate browser CSRF cookies.
      ADMIN_CSRF_SECRET: ${ADMIN_CSRF_SECRET:-lh-dev-csrf-secret-change-me}
      ADMIN_ALLOWED_ORIGIN: ${ADMIN_ALLOWED_ORIGIN:-http://127.0.0.1:${ADMIN_WEB_PORT:-3001}}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Single-operator local Studio: submitter may approve their own drafts.
      CONTENT_ALLOW_SELF_APPROVE: ${CONTENT_ALLOW_SELF_APPROVE:-true}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  admin-web:
    profiles: ["apps"]
    build:
      context: ../..
      dockerfile: infra/local/Dockerfile.admin-web
    image: lh-local-admin-web:local
    container_name: lh-local-admin-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_HOST:-127.0.0.1}:${ADMIN_WEB_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      HOSTNAME: 0.0.0.0
      BACKEND_INTERNAL_URL: http://backend:3000
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:-http://127.0.0.1:${ADMIN_WEB_PORT:-3001}}
      NEXT_PUBLIC_ADMIN_ENV: ${NEXT_PUBLIC_ADMIN_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/en/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  lh_local_postgres_data:
    name: lh_local_postgres_data
  lh_local_redis_data:
    name: lh_local_redis_data
  lh_local_content_pack:
    name: lh_local_content_pack
